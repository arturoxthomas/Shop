name: .NET 10 build and test

on:
  push:
    branches:
      - modernizacion/net10
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Shop.Web.Tests/Shop.Web.Tests.csproj

      - name: Run automated tests
        run: dotnet test Shop.Web.Tests/Shop.Web.Tests.csproj --configuration Release --no-restore

      - name: Build web application
        run: dotnet build Shop.Web/Shop.Web.csproj --configuration Release --no-restore

      - name: Generate SQL Server create script from historical migrations
        run: |
          dotnet tool restore
          mkdir -p artifacts
          dotnet ef migrations script 0 --project Shop.Web/Shop.Web.csproj --startup-project Shop.Web/Shop.Web.csproj --output artifacts/Shop-Create.sql

      - name: Upload database creation script
        uses: actions/upload-artifact@v4
        with:
          name: shop-database-create-script
          path: artifacts/Shop-Create.sql
          if-no-files-found: error
