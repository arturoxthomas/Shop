name: .NET 10 build

on:
  push:
    branches:
      - modernizacion/net10
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Shop.Web/Shop.Web.csproj

      - name: Build
        run: dotnet build Shop.Web/Shop.Web.csproj --configuration Release --no-restore
